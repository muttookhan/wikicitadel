name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Install Python dependencies
        run: pip install -r tools/lens/requirements.txt

      - name: Lint gate (ruff E9,F — see pyproject.toml)
        run: |
          pip install ruff==0.17.4
          ruff check --select E9,F scripts tools

      - name: Engine test suite (the README command)
        run: python3 -m unittest discover -s scripts/tests

      - name: Ask door test suite
        run: python3 -m unittest discover -s tools/ask/tests

      - name: Install check
        run: sh install.sh

      - name: Rebuild the Lens
        run: python3 tools/lens/build_lens.py --repo . --out "$RUNNER_TEMP/lens-site"
