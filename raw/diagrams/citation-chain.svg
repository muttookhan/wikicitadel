<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120" role="img" aria-label="Citation chain diagram: a claim points to its source page, which points to the preserved raw file.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="10" y="35" width="170" height="50" rx="8" fill="#eef2ff" stroke="#444444"/>
  <text x="95" y="65" text-anchor="middle" font-family="sans-serif" font-size="16">Claim</text>
  <line x1="180" y1="60" x2="225" y2="60" stroke="#444444" marker-end="url(#arrow)"/>
  <rect x="230" y="35" width="170" height="50" rx="8" fill="#ecfdf5" stroke="#444444"/>
  <text x="315" y="65" text-anchor="middle" font-family="sans-serif" font-size="16">Source page</text>
  <line x1="400" y1="60" x2="445" y2="60" stroke="#444444" marker-end="url(#arrow)"/>
  <rect x="450" y="35" width="170" height="50" rx="8" fill="#fff7ed" stroke="#444444"/>
  <text x="535" y="65" text-anchor="middle" font-family="sans-serif" font-size="16">Raw file</text>
</svg>
